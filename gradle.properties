version=0.1.0-SNAPSHOT
kotlin.code.style=official
kotlin.native.enableKlibsCrossCompilation=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# gradle
#
# 4g (round 822, on an 8-core / 15.6 GB box). THIS IS THE KOTLIN/NATIVE HEAP:
# K/N compiles inside the GRADLE daemon, not the Kotlin one — "the same JVM
# process is used", per Kotlin's own compilation-time tips page — and there is no
# `kotlin.native.jvmArgs` (round 771 believed there was and was wrong; round 772
# corrected it). So the value below, and nothing else, is what bounds a native
# compile.
#
# History, because the number moved for a reason and will look arbitrary later:
# round 720 cut this to 1g so the 5g Kotlin daemon fit on the OLD 7.7 GB host —
# and that cut is exactly what starved Kotlin/Native, which OOMs at 1g no matter
# what the Kotlin daemon is given. Round 772 measured 6g as SUFFICIENT but never
# probed below it; 6g was also unusable on 7.7 GB, which is how "K/N cannot build
# here" became a standing belief.
#
# 4g is MEASURED, not inferred, on the new box: compileKotlinLinuxX64 2m06s,
# compileTestKotlinLinuxX64 1m39s, and a full linuxX64Test (compile + link + run
# 13,689 tests) 25m33s — all green, peak system usage 12.5 GB, lowest available
# 3.1 GB. Round 772's 6g was therefore not the floor.
#
# Why raising the cap does not cost the JVM path anything: -Xmx is a ceiling, not
# a reservation, and Gradle's own daemon still peaks ~1.1 GB on a JVM build. The
# ceiling only matters if something actually claims it, and only the native
# backend does.
#
# The real ceiling is physical, and swap is still ZERO — over-commit stalls this
# box rather than failing cleanly. Worst case here is 4g (this) + 5g (Kotlin
# daemon, below) + a forked test worker ~= 10g of heap plus non-heap overhead;
# during the native suite the Gradle daemon reached 8.5 GB RSS, well past its 4g
# heap, because the konan/LLVM backend allocates OUTSIDE the heap and no -Xmx
# bounds it. That is the margin, and it is why CLAUDE.md requires native tasks to
# run ALONE — never beside a suite run or a bench — after `./gradlew --stop` plus
# a graceful bracket-pattern kill of the Kotlin daemon. Do not raise this to 6g
# without re-measuring: the headroom it eats is the headroom the LINK needs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# (BUILD.1, owner-approved 2026-07-26) The Kotlin compile daemon would otherwise
# INHERIT org.gradle.jvmargs above, and a FROM-SCRATCH compile of this module
# (~110k lines of Checker.kt plus the generated lib sources) does not fit 2g:
# it does not fail, it GC-thrashes and looks exactly like a hang — 350% CPU, RSS
# pinned at the ceiling, and zero class files, because Kotlin's backend only
# writes output at the end. At 4g it stops thrashing and says so explicitly:
# "Not enough memory to run compilation. Try to increase it via 'gradle.properties'".
# Measured on this module: 2g hangs, 3g dies mid-compile, 4g fails with that
# message in ~6 min, 5g is the first that completes.
#
# Why so much for one module: Checker.kt alone is ~110k lines in a SINGLE file and
# the generated real-lib sources embed 3.71 MB of lib text as string constants, so
# the unit cannot be streamed — it is all resident at once. Round 731 shipping the
# DOM set took that payload from 566 KB to 3.71 MB and did NOT need more heap: the
# emission is split over ~250 KB RealLibFilesPart*.kt files, and a cold compile got
# FASTER (2m25s). Keep the split — one big generated file is what exhausts 5g.
#
# An INCREMENTAL compile takes ~2 minutes and needs none of this. What forces the
# expensive case is invalidating the incremental caches — above all `pkill -9` of
# the Kotlin daemon, which is part of the memory-freeing ritual in CLAUDE.md. So
# this setting is the fallback, not the fix: prefer a graceful stop.
kotlin.daemon.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=512m
# caching seems incompatible with jreleaser
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#org.gradle.caching=true
org.gradle.parallel=true
