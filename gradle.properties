version=0.1.0-SNAPSHOT
kotlin.code.style=official
kotlin.native.enableKlibsCrossCompilation=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# gradle
#
# 1g, not 2g (round 720): this daemon coexists with the Kotlin compile daemon
# configured below, and on a 7.7 GB box 2g + 4g + their non-heap overhead + the
# agent process oversubscribes physical memory with no swap — the kernel then
# kills the largest process (the Kotlin daemon) MID-COMPILE, which presents as
# the build silently restarting and never converging, with no OOM in any log.
# Gradle's own daemon peaked at 1.1 GB on this build, so 1g is sized to measured
# use; the compiler needs the headroom far more than the build tool does.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# (BUILD.1, owner-approved 2026-07-26) The Kotlin compile daemon would otherwise
# INHERIT org.gradle.jvmargs above, and a FROM-SCRATCH compile of this module
# (~110k lines of Checker.kt plus the generated lib sources) does not fit 2g:
# it does not fail, it GC-thrashes and looks exactly like a hang — 350% CPU, RSS
# pinned at the ceiling, and zero class files, because Kotlin's backend only
# writes output at the end. At 4g it stops thrashing and says so explicitly:
# "Not enough memory to run compilation. Try to increase it via 'gradle.properties'".
# Measured on this module: 2g hangs, 3g dies mid-compile, 4g fails with that
# message in ~6 min, 5g is the first that completes.
#
# Why so much for one module: Checker.kt alone is ~110k lines in a SINGLE file and
# the generated real-lib sources embed 3.71 MB of lib text as string constants, so
# the unit cannot be streamed — it is all resident at once. Round 731 shipping the
# DOM set took that payload from 566 KB to 3.71 MB and did NOT need more heap: the
# emission is split over ~250 KB RealLibFilesPart*.kt files, and a cold compile got
# FASTER (2m25s). Keep the split — one big generated file is what exhausts 5g.
#
# An INCREMENTAL compile takes ~2 minutes and needs none of this. What forces the
# expensive case is invalidating the incremental caches — above all `pkill -9` of
# the Kotlin daemon, which is part of the memory-freeing ritual in CLAUDE.md. So
# this setting is the fallback, not the fix: prefer a graceful stop.
kotlin.daemon.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=512m
# caching seems incompatible with jreleaser
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#org.gradle.caching=true
org.gradle.parallel=true
