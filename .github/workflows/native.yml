# The two NATIVE toolchains, both manual-trigger only:
#   * `native-image` — the GraalVM AOT executable (round 771).
#   * `kotlin-native` — the Kotlin/Native linuxX64 target and the corpus suite
#     run against it (round 775).
#
# MANUAL TRIGGER ONLY, deliberately. Neither is a correctness gate for a normal
# push — the JVM suite is — and both are slow. Attaching the AOT binary to
# releases is a separate decision (see (AOT.1) in PLAN-PHASE-5.md) and is
# intentionally NOT wired here.
#
# THIS WORKFLOW IS WHERE KOTLIN/NATIVE LIVES NOW, and that is an owner directive,
# not a preference: a local K/N test link froze the 7.7 GB / zero-swap dev box for
# ~2 hours (round 775; see the CLAUDE.md rule). A GitHub standard runner has 16 GB,
# so the work belongs here. `./gradlew build` on a normal checkout is untouched —
# the linuxX64 target registers only under `-PenableNativeTargets=true`.
#
# Why this is a separate workflow at all: build-main/build-pr both delegate to
# the shared xemantic/.github reusable workflow, which knows nothing about either
# toolchain.
#
# NOTE: unlike the machine this was developed on, ubuntu-latest ships a working
# C toolchain (gcc, binutils, libc headers, zlib), so none of the unprivileged
# toolchain assembly described in docs/perf/aot-native-image.md § 8 applies here.
name: Native

on:
  workflow_dispatch:
    inputs:
      graalvm:
        description: "Build the GraalVM native image"
        type: boolean
        default: true
      verify:
        description: "Run the native binary against the compiler bench profile and diff it against the JVM"
        type: boolean
        default: true
      kotlin_native:
        description: "Compile the Kotlin/Native linuxX64 target and run the corpus suite on it"
        type: boolean
        default: true

jobs:
  native:
    if: ${{ inputs.graalvm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ORACLE GraalVM, not Community — PGO is an Oracle-only feature and it is
      # the biggest single lever ever measured on this compiler (2026-08-10:
      # -13.9% check-only / -19.5% emit over the Oracle base, and Oracle base is
      # itself ahead of CE). `distribution: graalvm` is Oracle GraalVM under the
      # GraalVM Free Terms and Conditions, which permits production use and
      # redistribution of the images built with it.
      #
      # 25, not 26: GraalVM ships NO JDK 26 build in either distribution
      # (Oracle's graalvm-jdk-26 404s, CE's newest is graal-25.2.4 / JDK 25.0.4),
      # which is exactly why `javaTarget` is 25 and not 26 — native-image cannot
      # read a class file its own JVM rejects. Raise both together, or neither.
      - name: Set up GraalVM (Oracle, for PGO)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      # Three builds and two training runs — see the script's header for the
      # recipe and the both-modes trap. Not inlined here: bench.yml runs the same
      # cycle, and two copies of it would drift silently.
      - name: Build native image (Oracle + PGO)
        run: scripts/build-native-pgo.sh --graalvm-home "$GRAALVM_HOME"

      - name: Report binary
        run: |
          ls -la xemantic-typescript-compiler-cli/build/native/xtsc
          ./xemantic-typescript-compiler-cli/build/native/xtsc --help | head -5 || true

      # The gate is byte-identity against the JVM, never a diagnostic COUNT: two
      # runs can agree on 46 and disagree on which 46.
      - name: Verify against the JVM (byte-identity)
        if: ${{ inputs.verify }}
        run: |
          set -euo pipefail
          scripts/bench-compile-tsc.sh --project compiler --no-emit --no-log --iterations 1
          PROFILE=$(ls -d build/bench/tsc-project-* | head -1)
          # NOT `cat build/bench/cp.txt` (which is what this line used to be):
          # that file lives under gitignored build/, NOTHING in CI writes it, and
          # `DepClasspathGuardTest` — which exists to stop exactly this — only
          # walks scripts/, so a workflow reading it is outside the guard. An
          # empty tail would have left `java` unable to find the Kotlin stdlib,
          # and the `|| true` below would have captured the resulting stack trace
          # into jvm.raw and failed the diff as if the NATIVE image were wrong.
          CP="xemantic-typescript-compiler-core/build/classes/kotlin/jvm/main:$(scripts/lib/dep-classpath.sh --print)"
          # The compiler exits 1 when it finds errors (tsc semantics, 2026-08-08)
          # and this profile has 46. Under `set -euo pipefail` that would fail the
          # PIPELINE, so each run is captured first and filtered afterwards; the
          # byte-identity gate below is unchanged.
          java -Xmx4g -cp "$CP" com.xemantic.typescript.compiler.MainKt \
            --noEmit --listAll "$PROFILE" > jvm.raw 2>&1 || true
          grep -v '^time:' jvm.raw | sort > jvm.txt
          ./xemantic-typescript-compiler-cli/build/native/xtsc \
            --noEmit --listAll "$PROFILE" > native.raw 2>&1 || true
          grep -v '^time:' native.raw | sort > native.txt
          diff jvm.txt native.txt && echo "native output is byte-identical to the JVM"

      - uses: actions/upload-artifact@v4
        with:
          name: xtsc-linux-x64
          path: xemantic-typescript-compiler-cli/build/native/xtsc
          if-no-files-found: error

  # Kotlin/Native (linuxX64) — compile, link, and run the WHOLE corpus suite
  # against the native binary. This is the only gate that can see a native-only
  # divergence at all: `jvmTest` compiles commonTest with the JVM compiler, which
  # is looser than Kotlin/Native on backtick test names, `kotlin.assert` and
  # JVM-only stdlib (CLAUDE.md § "must compile for Kotlin/Native").
  #
  # Round 775 measured, locally, before local native work was forbidden:
  # compile (main + test) 2m10s, `linkDebugTestLinuxX64` 1m03s, the suite
  # 14m28s — 9,161 tests, 2 failures. DEBUG, not release, is the lever: round
  # 772's RELEASE test link died to the OS OOM-killer after ~22 min on the dev
  # box. If a release-mode native artifact is ever wanted, treat it as a
  # separate, separately-measured job.
  #
  # MEMORY: Kotlin/Native compiles INSIDE THE GRADLE DAEMON, so its heap is
  # `org.gradle.jvmargs` — which gradle.properties pins at 1g to leave room for
  # the 5g Kotlin JVM daemon on the dev box, and 1g does not link this module.
  # `-Dorg.gradle.jvmargs` on the command line is the override; 6g measured
  # sufficient (round 772) and fits a 16 GB runner.
  kotlin-native:
    if: ${{ inputs.kotlin_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The property gate is the whole point: without it the linuxX64 target does
      # not register, so nothing about a normal build changes.
      - name: Run the corpus suite on Kotlin/Native (linuxX64)
        run: |
          ./gradlew -PenableNativeTargets=true \
            -Dorg.gradle.jvmargs=-Xmx6g \
            linuxX64Test

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linuxX64-test-results
          path: |
            xemantic-typescript-compiler-core/build/test-results/linuxX64Test
            build/reports/tests/linuxX64Test
          if-no-files-found: warn
