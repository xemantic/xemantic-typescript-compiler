# The NATIVE toolchains, all manual-trigger only:
#   * `tsgo-native-image` — THE SHIPPED `xtsc` IMAGE (`xtsc-linux-x64`, since
#     (TSGO.8-b)): the tsgo port's PGO image, replayed against tsgo 7.0.2's own output.
#   * `tsgo-kotlin-native` — the port's common suite on Kotlin/Native linuxX64.
#   * `kotlin-native` — the retiring `-core`'s corpus suite on linuxX64 (round 775);
#     it leaves with `-core` ((TSGO.8-e)). `-core`'s own GraalVM image job left in (8-b).
#
# MANUAL TRIGGER ONLY, deliberately. Neither is a correctness gate for a normal
# push — the JVM suite is — and both are slow. Attaching the AOT binary to
# releases is a separate decision (see (AOT.1) in PLAN-PHASE-5.md) and is
# intentionally NOT wired here.
#
# THIS WORKFLOW IS WHERE KOTLIN/NATIVE LIVES NOW, and that is an owner directive,
# not a preference: a local K/N test link froze the 7.7 GB / zero-swap dev box for
# ~2 hours (round 775; see the CLAUDE.md rule). A GitHub standard runner has 16 GB,
# so the work belongs here. `./gradlew build` on a normal checkout is untouched —
# the linuxX64 target registers only under `-PenableNativeTargets=true`.
#
# Why this is a separate workflow at all: build-main/build-pr both delegate to
# the shared xemantic/.github reusable workflow, which knows nothing about either
# toolchain.
#
# NOTE: unlike the machine this was developed on, ubuntu-latest ships a working
# C toolchain (gcc, binutils, libc headers, zlib), so none of the unprivileged
# toolchain assembly described in docs/perf/aot-native-image.md § 8 applies here.
name: Native

on:
  workflow_dispatch:
    inputs:
      kotlin_native:
        description: "Compile the Kotlin/Native linuxX64 target and run the corpus suite on it"
        type: boolean
        default: true
      tsgo:
        description: "The tsgo port: its PGO image against tsgo 7.0.2, and its suite on Kotlin/Native"
        type: boolean
        default: true

jobs:
  # Kotlin/Native (linuxX64) — compile, link, and run the WHOLE corpus suite
  # against the native binary. This is the only gate that can see a native-only
  # divergence at all: `jvmTest` compiles commonTest with the JVM compiler, which
  # is looser than Kotlin/Native on backtick test names, `kotlin.assert` and
  # JVM-only stdlib (CLAUDE.md § "must compile for Kotlin/Native").
  #
  # Round 775 measured, locally, before local native work was forbidden:
  # compile (main + test) 2m10s, `linkDebugTestLinuxX64` 1m03s, the suite
  # 14m28s — 9,161 tests, 2 failures. DEBUG, not release, is the lever: round
  # 772's RELEASE test link died to the OS OOM-killer after ~22 min on the dev
  # box. If a release-mode native artifact is ever wanted, treat it as a
  # separate, separately-measured job.
  #
  # MEMORY: Kotlin/Native compiles INSIDE THE GRADLE DAEMON, so its heap is
  # `org.gradle.jvmargs` — which gradle.properties pins at 1g to leave room for
  # the 5g Kotlin JVM daemon on the dev box, and 1g does not link this module.
  # `-Dorg.gradle.jvmargs` on the command line is the override; 6g measured
  # sufficient (round 772) and fits a 16 GB runner.
  kotlin-native:
    if: ${{ inputs.kotlin_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The property gate is the whole point: without it the linuxX64 target does
      # not register, so nothing about a normal build changes.
      - name: Run the corpus suite on Kotlin/Native (linuxX64)
        run: |
          ./gradlew -PenableNativeTargets=true \
            -Dorg.gradle.jvmargs=-Xmx6g \
            linuxX64Test

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linuxX64-test-results
          path: |
            xemantic-typescript-compiler-core/build/test-results/linuxX64Test
            build/reports/tests/linuxX64Test
          if-no-files-found: warn

  # The tsgo port's GraalVM image, gated against tsgo 7.0.2 itself (not against
  # the JVM): scripts/tsgo-native-ci.sh fetches the official tsgo binary (sha1
  # pinned), materializes the 8 tsc profiles, builds the PGO image (Oracle
  # GraalVM — PGO is Oracle-only) and replays tsgo's recorded stdout, exit status
  # and written files for the profiles (check-only and emit) and the command-line
  # cases through it. Any difference fails. The census libraries and the
  # type-oracle projects are local data and are not replayed here.
  tsgo-native-image:
    if: ${{ inputs.tsgo }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM (Oracle, for PGO)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Build the PGO image and replay tsgo 7.0.2 through it
        run: scripts/tsgo-native-ci.sh --graalvm "$GRAALVM_HOME"

      # The shipped binary: named `xtsc`, uploaded as `xtsc-linux-x64` — the name `-core`'s image carried
      # until (TSGO.8-b) (owner decision 2026-10-16: the port's image replaces it).
      - name: Name the binary xtsc
        run: |
          mkdir -p dist
          cp xemantic-typescript-compiler-tsgo/build/native/xtsc-tsgo-pgo dist/xtsc
          ./dist/xtsc --version

      - uses: actions/upload-artifact@v4
        with:
          name: xtsc-linux-x64
          path: dist/xtsc
          if-no-files-found: error

      - name: Upload the replay on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsgo-cli-native-replay
          path: |
            build/goport/cli-oracle
            build/goport/cli-native
          if-no-files-found: warn

  # The tsgo port's common suite (runtime shims, Go oracle vectors, the port's
  # concurrency model) compiled and run on Kotlin/Native linuxX64. The heap
  # override is the kotlin-native job's, for the same reason.
  tsgo-kotlin-native:
    if: ${{ inputs.tsgo }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the tsgo port's suite on Kotlin/Native (linuxX64)
        run: |
          ./gradlew -PenableNativeTargets=true \
            -Dorg.gradle.jvmargs=-Xmx6g \
            :xemantic-typescript-compiler-tsgo:linuxX64Test

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsgo-linuxX64-test-results
          path: |
            xemantic-typescript-compiler-tsgo/build/test-results/linuxX64Test
            xemantic-typescript-compiler-tsgo/build/reports/tests/linuxX64Test
          if-no-files-found: warn
