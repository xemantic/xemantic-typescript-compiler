# Three-way compile bench (xtsc vs reference JS tsc vs native tsgo) on the pinned
# TypeScript `compiler` profile. Publishes a per-run Markdown report under
# bench-history/runs/ and prepends a row to bench-history/README.md so performance
# and compliance improvements are observable across runs.
name: Bench

on:
  workflow_dispatch:
    inputs:
      tsc_spec:
        description: 'npm spec for the reference JS tsc'
        default: 'typescript@6'
      tsgo_spec:
        description: 'npm spec for the native TypeScript 7 compiler (typescript@7; the retired preview channel was @typescript/native-preview)'
        default: 'typescript@7'
      label:
        description: 'optional note stored in the report'
        default: ''
  push:
    branches: [main]
    # Loop guard: the bot commits results under bench-history/, which must not
    # re-trigger this workflow. (The result commit is also tagged [skip ci].)
    paths-ignore:
      - 'bench-history/**'

# Let each push queue rather than cancel, so every merge gets a data point; the
# push step rebases to absorb a concurrent run's commit.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ORDER IS LOAD-BEARING. setup-graalvm sets BOTH GRAALVM_HOME and JAVA_HOME;
      # setup-java then puts JAVA_HOME back to temurin 26 while GRAALVM_HOME
      # survives. So Gradle and the JVM bench arm keep running on the exact JDK
      # every archived row was measured with, and GraalVM is used ONLY to build
      # the native image. Swapping these two steps would silently re-baseline the
      # whole xtsc series onto GraalVM's JIT.
      #
      # ORACLE, not Community, since 2026-08-10 — and this RE-BASELINES the AOT
      # column of the archived series. Every row before that date measured a CE
      # image (which had CI's AOT arm at ~1.02x tsc); every row after measures
      # Oracle GraalVM + PGO, which on the dev box is -13.9% check-only / -19.5%
      # emit against the Oracle base and ~1.8-1.9x tsc. The AOT column is
      # therefore NOT comparable across that boundary. The xtsc JVM, tsc and
      # tsgo columns are untouched and remain continuous.
      - name: Set up GraalVM (Oracle, for the AOT arm only)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install reference compilers (tsc, tsgo)
        id: refs
        env:
          # ${{ }} evaluated by GitHub into env values (no bash quote-breakout / injection).
          TSC_SPEC: ${{ github.event.inputs.tsc_spec || 'typescript@6' }}
          TSGO_SPEC: ${{ github.event.inputs.tsgo_spec || 'typescript@7' }}
        run: |
          # SEPARATE npm roots, and that is now load-bearing: since the 7.0
          # release the native compiler IS the `typescript` package, so the two
          # reference specs share a package NAME (typescript@6 vs typescript@7)
          # and cannot coexist in one node_modules.
          for pair in "tsc:$TSC_SPEC" "tsgo:$TSGO_SPEC"; do
            dir="$RUNNER_TEMP/bench-tools/${pair%%:*}"
            mkdir -p "$dir" && (cd "$dir" && npm init -y >/dev/null 2>&1 \
              && npm install --no-audit --no-fund "${pair#*:}")
          done
          # The bin NAME differs by spec: `@typescript/native-preview` ships
          # `tsgo`, `typescript@7` ships `tsc` (it replaces tsc). Resolve
          # whichever the installed spec provided rather than assuming.
          TSGO_DIR="$RUNNER_TEMP/bench-tools/tsgo/node_modules/.bin"
          TSGO_BIN="$TSGO_DIR/tsgo"; [ -x "$TSGO_BIN" ] || TSGO_BIN="$TSGO_DIR/tsc"
          [ -x "$TSGO_BIN" ] || { echo "no tsgo/tsc bin from $TSGO_SPEC" >&2; exit 1; }
          echo "tsc=$RUNNER_TEMP/bench-tools/tsc/node_modules/.bin/tsc" >> "$GITHUB_OUTPUT"
          echo "tsgo=$TSGO_BIN" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/bench-tools/tsc/node_modules/.bin/tsc" --version
          "$TSGO_BIN" --version

      # PLAIN Oracle image, NOT the PGO one — deliberately, and the AOT column
      # must be read accordingly.
      #
      # This workflow runs on EVERY push to main, and the PGO cycle is three
      # builds plus two training runs (~10 min against ~2). That latency is not
      # worth paying per push for a column that is not the headline. PGO lives in
      # native.yml, which BUILDS THE SHIPPED ARTIFACT and is manual-trigger only.
      #
      # CONSEQUENCE, stated so nobody misreads the series: this column is the
      # Oracle BASE image and is ~14% (check-only) / ~20% (emit) SLOWER than the
      # binary native.yml publishes. It tracks AOT trend, not shipped AOT
      # performance; for the latter read docs/perf/aot-native-image.md § 10 or a
      # native.yml run.
      #
      # ~2 min, and non-fatal on purpose: if the image fails to build the bench
      # still publishes its 3-way row, with the AOT columns reading "—".
      - name: Build the AOT binary (Oracle, no PGO — see comment)
        id: aot
        continue-on-error: true
        run: |
          ./gradlew :xemantic-typescript-compiler-cli:nativeImage \
            --no-configuration-cache -PgraalvmHome="$GRAALVM_HOME"
          # The image is built by the CLI module — the lean one-shot entry point,
          # which carries the compiler and none of the daemon transport. This step
          # is continue-on-error, so a stale path would SILENTLY drop the AOT arm
          # instead of failing; assert it exists.
          bin="$PWD/xemantic-typescript-compiler-cli/build/native/xtsc"
          test -x "$bin" || { echo "native image missing at $bin" >&2; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run 3-way bench (+ AOT arm)
        env:
          BENCH_RUNNER: 'ubuntu-latest, JDK 26 (GitHub-hosted, shared)'
          TSC_BIN: ${{ steps.refs.outputs.tsc }}
          TSGO_BIN: ${{ steps.refs.outputs.tsgo }}
          NATIVE_BIN: ${{ steps.aot.outputs.bin }}
          BENCH_LABEL: ${{ github.event.inputs.label || format('push {0}', github.sha) }}
        run: |
          native_args=()
          if [[ -n "${NATIVE_BIN:-}" && -x "${NATIVE_BIN:-}" ]]; then
            native_args=(--xtsc-native "$NATIVE_BIN")
          else
            echo "::warning::AOT binary unavailable — publishing the 3-way row without it"
          fi
          # The WARM arm is the headline (see bench-3way.sh § 1a): the JVM is the
          # fastest target and the one the perf arc optimises, so the series has
          # to watch the number that converges on tsc. warmup 6 is the measured
          # floor for a <1% between-process spread; 5 measured iterations keeps
          # the added CI time near ~5 min per mode.
          #
          # TWO warm arms, and this is why the series never has to pick a JVM.
          # The Graal JIT is a measured ~5% (check-only) / ~10% (emit) WARM win
          # over HotSpot while LOSING cold by 8-16%, and warm is the daemon
          # regime — so "which JVM should the bench use" had exactly one honest
          # answer that is not a choice: report both, on identical bytecode, in
          # the same run. Temurin stays the PRIMARY (neutral, tracks upstream
          # JDKs, closest to what users run, and it does not freeze the series on
          # JDK 25 the way a GraalVM-only arm would).
          #
          # GRAALVM_HOME survives the setup-java step that follows setup-graalvm
          # (see the ordering comment above), which is what makes this arm
          # available without disturbing the build JDK.
          warm2_args=()
          if [[ -n "${GRAALVM_HOME:-}" && -x "$GRAALVM_HOME/bin/java" ]]; then
            warm2_args=(--warm-jvm2 "graal-oracle25=$GRAALVM_HOME/bin/java")
          else
            echo "::warning::GRAALVM_HOME unusable — publishing a single warm arm"
          fi
          scripts/bench-3way.sh \
            --tsc  "$TSC_BIN" \
            --tsgo "$TSGO_BIN" \
            "${native_args[@]}" \
            --project compiler \
            --xtsc-iters 1 --ref-iters 3 \
            --xtsc-warmup 6 --xtsc-warm-iters 5 \
            --warm-jvm "temurin26=$JAVA_HOME/bin/java" \
            "${warm2_args[@]}" \
            --label "$BENCH_LABEL"

      - name: Commit results
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then check the staged diff — the new run .md is untracked,
          # so a plain `git diff` would miss it.
          git add bench-history/
          if git diff --cached --quiet -- bench-history/; then
            echo "no bench-history changes"; exit 0
          fi
          git commit -m "chore(bench): 3-way run @ ${GITHUB_SHA::12} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          echo "error: could not push bench results after retries" >&2; exit 1
