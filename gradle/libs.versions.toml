[versions]
kotlinTarget = "2.4"
# The BYTECODE target, not the JDK the build runs on — there is deliberately no
# Gradle toolchain (see the core module's link to Jake Wharton's post), so the
# build compiles with whatever JDK is on PATH and merely EMITS for this one.
# Raised 17 -> 25 on 2026-08-10 (owner-approved). The ceiling is GraalVM, not
# Kotlin: `JvmTarget` reaches JVM_26, but GraalVM ships no JDK 26 build at all
# (Oracle's graalvm-jdk-26 404s; CE's newest is graal-25.2.4 / JDK 25.0.4), and
# native-image cannot read a class file its own JVM rejects. So targeting 26
# would cost the `nativeImage` task and both CI native workflows — i.e. the
# fastest artifact this project ships. Re-test the ceiling when GraalVM 26 lands.
javaTarget = "25"

kotlin = "2.4.10"
asm = "9.10.1"

xemanticKotlinTest = "1.17.5"
kotlinxCoroutines = "1.11.0"
kotlinxIo = "0.9.1"
kotlinxSerialization = "1.11.0"
# ktor-network carries the Unix-domain-socket transport shared by the daemon and
# the client. Unix sockets are CIO-engine only, and on mingwX64 they are guarded
# by a runtime AF_UNIX probe (Windows 10 1803+); on JVM `UnixSocketAddress`
# reflects onto `java.net.UnixDomainSocketAddress`, so it needs Java 16+.
ktor = "3.5.2"

versionsPlugin = "0.54.0"
dokkaPlugin = "2.2.0"
mavenPublishPlugin = "0.37.0"
jreleaserPlugin = "1.25.0"
xemanticConventionsPlugin = "0.6.8"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
xemantic-kotlin-test = { module = "com.xemantic.kotlin:xemantic-kotlin-test", version.ref = "xemanticKotlinTest" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }

# Consumed by the `build-logic` included build only — a Gradle convention plugin
# must put the plugins it applies on its own compile classpath, and it cannot do
# that through the [plugins] block below (that one is for `alias(...)` in a
# build script's `plugins { }`).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-power-assert = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-power-assert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokkaPlugin" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublishPlugin" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaserPlugin" }
xemantic-conventions = { id = "com.xemantic.gradle.xemantic-conventions", version.ref = "xemanticConventionsPlugin" }
